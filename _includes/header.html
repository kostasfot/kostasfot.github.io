<header class="sticky top-0 z-50 bg-brand-dark/95 border-b border-slate-800/80 transition-all duration-300">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <a href="{{ '/' | relative_url }}" class="flex items-center space-x-2 text-slate-100 font-mono font-bold text-lg tracking-tight group" aria-label="Konstantinos Fotoglou home">
                <span class="text-cyan-400 group-hover:text-teal-300 transition-colors">&lt;</span>
                <span>KF</span>
                <span class="text-cyan-400 group-hover:text-teal-300 transition-colors">/&gt;</span>
            </a>

            <nav class="hidden md:flex items-center space-x-7 font-mono text-xs" aria-label="Primary navigation">
                <a href="{{ '/#about' | relative_url }}" class="hover:text-cyan-400 transition-colors flex items-center gap-1"><span class="text-cyan-500">01.</span> About</a>
                <a href="{{ '/#skills' | relative_url }}" class="hover:text-cyan-400 transition-colors flex items-center gap-1"><span class="text-cyan-500">02.</span> Skills</a>
                <a href="{{ '/#experience' | relative_url }}" class="hover:text-cyan-400 transition-colors flex items-center gap-1"><span class="text-cyan-500">03.</span> Experience</a>
                <a href="{{ '/#education' | relative_url }}" class="hover:text-cyan-400 transition-colors flex items-center gap-1"><span class="text-cyan-500">04.</span> Education</a>
                <a href="{{ '/blog/' | relative_url }}" class="hover:text-cyan-400 transition-colors flex items-center gap-1{% if page.page_type == 'blog' or page.page_type == 'post' %} text-cyan-400{% endif %}"{% if page.page_type == 'blog' or page.page_type == 'post' %} aria-current="page"{% endif %}><span class="text-cyan-500">05.</span> Blog</a>
                <a href="{{ '/#contact' | relative_url }}" class="px-4 py-2 rounded-md bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 hover:bg-cyan-500/20 hover:border-cyan-400 transition-all duration-200">Contact</a>
            </nav>

            <button type="button" id="mobile-menu-btn" class="md:hidden text-slate-400 hover:text-slate-100 p-2 rounded-md focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400" aria-label="Toggle navigation" aria-controls="mobile-menu" aria-expanded="false">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </div>
    </div>

    <div id="mobile-menu" class="hidden md:hidden bg-slate-900 border-b border-slate-800 px-6 py-6 space-y-4 font-mono text-sm">
        <a href="{{ '/#about' | relative_url }}" class="mobile-link block text-slate-300 hover:text-cyan-400">01. About</a>
        <a href="{{ '/#skills' | relative_url }}" class="mobile-link block text-slate-300 hover:text-cyan-400">02. Skills</a>
        <a href="{{ '/#experience' | relative_url }}" class="mobile-link block text-slate-300 hover:text-cyan-400">03. Experience</a>
        <a href="{{ '/#education' | relative_url }}" class="mobile-link block text-slate-300 hover:text-cyan-400">04. Education</a>
        <a href="{{ '/blog/' | relative_url }}" class="mobile-link block{% if page.page_type == 'blog' or page.page_type == 'post' %} text-cyan-400{% else %} text-slate-300 hover:text-cyan-400{% endif %}"{% if page.page_type == 'blog' or page.page_type == 'post' %} aria-current="page"{% endif %}>05. Blog</a>
        <a href="{{ '/#contact' | relative_url }}" class="mobile-link block text-cyan-400 font-semibold">06. Contact</a>
    </div>
</header>
