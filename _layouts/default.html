<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B0F17">
    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="icon" href="{{ '/assets/icons/favicon-32x32.png' | relative_url }}" type="image/png" sizes="32x32">
    <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}" sizes="180x180">
    {% seo %}
    {% feed_meta %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0B0F17',
                            card: 'rgba(15, 23, 42, 0.65)',
                            border: 'rgba(30, 41, 59, 0.8)',
                            cyan: '#06b6d4',
                            teal: '#14b8a6',
                            glow: 'rgba(6, 182, 212, 0.15)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

    {% if page.page_type == 'post' %}
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
        };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script defer src="{{ '/assets/js/post-content.js' | relative_url }}"></script>
    {% endif %}
</head>
<body class="bg-brand-dark text-slate-300 font-sans antialiased selection:bg-cyan-500/30 selection:text-cyan-200 min-h-screen relative overflow-x-hidden page-{{ page.page_type | default: 'default' }}">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {% include background.html %}
    {% include header.html %}

    {{ content }}

    {% include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
